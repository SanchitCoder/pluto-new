<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />

    <!--
      Deliberately no static description/keywords/og:* tags here. Every real route is prerendered
      (scripts/prerender.mjs) with its own unique title/description/canonical/OG/JSON-LD baked into
      the served HTML via SEOHead + react-helmet-async. A static fallback here would sit alongside
      Helmet's tags rather than being replaced by them (Helmet only manages tags it rendered itself),
      producing two conflicting <meta name="description"> tags on every page — exactly the kind of
      mismatch flagged in the Oct 2026 SEO audit. This title is a pre-hydration fallback only.
    -->
    <title>Pluto Travels | Corporate Travel &amp; Luxury Concierge Dubai</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Outfit:wght@100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Meta Pixel Code (Noscript) -->
    <noscript>
      <img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1469939361218931&ev=PageView&noscript=1"/>
    </noscript>
  </body>
</html>
